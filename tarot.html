<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Cuántico | Katherine Brenes</title>
    
    <!-- Librerías de Diseño e Iconos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- React Core -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Configuración Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                    },
                    colors: {
                        tarot: {
                            dark: '#0a0310',
                            panel: '#160a24',
                            gold: '#d4af37',
                            goldLight: '#f3e5ab',
                            mystic: '#6b21a8',
                            silver: '#e2e8f0'
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(212, 175, 55, 0.2)' },
                            '50%': { boxShadow: '0 0 40px rgba(212, 175, 55, 0.5)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0a0310; color: #f3e5ab; overflow-x: hidden; }
        
        .glass-panel {
            background: rgba(22, 10, 36, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .text-gradient-gold {
            background: linear-gradient(to right, #d4af37, #fff8d6, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 4s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* Estrellas místicas de fondo */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
            background-image: radial-gradient(1px 1px at 20px 30px, #d4af37, rgba(0,0,0,0)),
                              radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                              radial-gradient(2px 2px at 90px 40px, #d4af37, rgba(0,0,0,0));
            background-repeat: repeat; background-size: 150px 150px;
            animation: twinkle 4s infinite alternate; opacity: 0.4;
        }
        @keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 0.6; } }

        /* --- EFECTO 3D PARA VOLTEAR CARTAS --- */
        .card-container {
            perspective: 1000px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        /* Frente de la carta (El reverso decorado que se ve al inicio) */
        .card-front {
            background: linear-gradient(135deg, #160a24, #2d0e45);
            border: 2px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-front::after {
            content: '';
            position: absolute; inset: 10px;
            border: 1px dashed rgba(212, 175, 55, 0.5);
            border-radius: 0.5rem;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
        }
        /* Dorso de la carta (La imagen del arcano) */
        .card-back {
            background-color: #0a0310;
            border: 2px solid #d4af37;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0310; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 3px; }
    </style>
</head>
<body class="antialiased selection:bg-tarot-gold selection:text-tarot-dark">

    <div class="stars"></div>
    
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[600px] h-[600px] bg-purple-900/20 rounded-full blur-[100px] mix-blend-screen"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-tarot-gold/10 rounded-full blur-[100px] mix-blend-screen"></div>
    </div>

    <div id="root" class="relative z-10 w-full min-h-screen flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const TarotApp = () => {
            const [isLoaded, setIsLoaded] = useState(false);
            const [cards, setCards] = useState([
                { id: 1, flipped: false, title: "La Sacerdotisa", position: "La Raíz (Pasado)", icon: "ph-moon-stars", img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop", 
                  meaning: "Katherine, tu energía de Escorpio siempre ha estado conectada con los misterios profundos. La Sacerdotisa revela que tu conocimiento sobre las plantas, los aceites y la sanación no es nuevo; es una sabiduría ancestral que llevas en el alma. Siempre has tenido el don de la intuición." },
                { id: 2, flipped: false, title: "La Fuerza", position: "El Centro (Presente)", icon: "ph-fire", img: "https://images.unsplash.com/photo-1614088653245-c1e138b69324?q=80&w=400&auto=format&fit=crop", 
                  meaning: "El león domado por la suavidad. En este momento de tu vida, estás equilibrando tu inmenso poder interior con la ternura y el servicio (Virgo). Tu marca 'Alquimia Natural' es el reflejo de esta carta: utilizas la fuerza de la naturaleza (Romero, Eucalipto) para domar la ansiedad y sanar a quienes te rodean." },
                { id: 3, flipped: false, title: "La Estrella", position: "El Destino (Futuro)", icon: "ph-sparkle", img: "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=400&auto=format&fit=crop", 
                  meaning: "La más hermosa de las cartas. Representa inspiración, esperanza y conexión cósmica. La Estrella te augura que tu camino con la alquimia y la curación te llevará a brillar intensamente. Eres una pequeña Luna protegida por fuerzas mayores, destinada a guiar e iluminar a otros en su viaje hacia la paz." }
            ]);

            const [activeReading, setActiveReading] = useState(null);

            useEffect(() => {
                setTimeout(() => setIsLoaded(true), 500);
            }, []);

            const flipCard = (id) => {
                setCards(cards.map(c => c.id === id ? { ...c, flipped: true } : c));
                const flippedCard = cards.find(c => c.id === id);
                setActiveReading(flippedCard);
            };

            const allFlipped = cards.every(c => c.flipped);

            return (
                <div className="flex flex-col min-h-screen py-12 px-4 md:px-8 max-w-6xl mx-auto w-full">
                    
                    {/* ENCABEZADO */}
                    <header className={`text-center mb-12 transition-all duration-1000 transform ${isLoaded ? 'translate-y-0 opacity-100' : '-translate-y-10 opacity-0'}`}>
                        <div className="inline-flex items-center justify-center w-14 h-14 rounded-full border border-tarot-gold/50 bg-tarot-gold/10 mb-4 shadow-[0_0_20px_rgba(212,175,55,0.3)]">
                            <i className="ph-thin ph-cards text-2xl text-tarot-goldLight"></i>
                        </div>
                        <h1 className="font-serif text-3xl md:text-5xl font-bold mb-2 text-gradient-gold tracking-wider">TIRADA CUÁNTICA</h1>
                        <p className="font-serif text-xl text-white tracking-widest uppercase mb-4">Katherine Brenes</p>
                        
                        <div className="flex flex-wrap justify-center items-center gap-3 text-xs font-mono text-tarot-silver/60 tracking-widest uppercase">
                            <span>Sincronía Astral</span>
                            <span className="w-1.5 h-1.5 rounded-full bg-tarot-gold"></span>
                            <span>Alquimia Natural</span>
                        </div>
                    </header>

                    {/* MESA DE CARTAS */}
                    <div className={`flex justify-center gap-4 md:gap-10 mb-16 perspective-1000 transition-all duration-1000 delay-300 transform ${isLoaded ? 'scale-100 opacity-100' : 'scale-95 opacity-0'}`}>
                        {cards.map((card, index) => (
                            <div 
                                key={card.id} 
                                className={`card-container w-28 h-44 md:w-56 md:h-80 ${card.flipped ? 'flipped' : 'animate-float'}`}
                                style={{ animationDelay: `${index * 0.4}s` }}
                                onClick={() => !card.flipped && flipCard(card.id)}
                            >
                                <div className="card-inner">
                                    {/* Reverso (Oculto al inicio) */}
                                    <div className="card-front flex flex-col items-center justify-center">
                                        <i className="ph-thin ph-sparkle text-3xl md:text-5xl text-tarot-gold opacity-50 mb-2"></i>
                                        <div className="font-serif text-[10px] md:text-sm text-tarot-gold uppercase tracking-widest">Arcano</div>
                                    </div>
                                    
                                    {/* Frente (Carta revelada) */}
                                    <div className="card-back relative">
                                        <img src={card.img} alt={card.title} className="absolute inset-0 w-full h-full object-cover opacity-60 mix-blend-luminosity" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-tarot-dark via-transparent to-transparent"></div>
                                        <div className="relative z-10 h-full flex flex-col items-center justify-between p-4">
                                            <div className="w-full text-center">
                                                <span className="bg-tarot-dark/80 backdrop-blur-sm px-3 py-1 text-[8px] md:text-xs font-mono text-tarot-gold uppercase tracking-widest border border-tarot-gold/30 rounded-full">
                                                    {card.position}
                                                </span>
                                            </div>
                                            <div className="text-center w-full bg-tarot-dark/90 backdrop-blur-md py-3 border-t border-tarot-gold/50">
                                                <h3 className="font-serif font-bold text-sm md:text-xl text-white tracking-wider">{card.title}</h3>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* ÁREA DE LECTURA (EL MENSAJE) */}
                    <div className="max-w-3xl mx-auto w-full min-h-[250px]">
                        {!activeReading && !allFlipped && (
                            <div className="text-center text-tarot-silver/50 font-serif text-lg md:text-xl animate-pulse">
                                El cosmos te aguarda, Katherine. <br/>Haz clic en una carta para revelar su sabiduría.
                            </div>
                        )}

                        {activeReading && (
                            <div className="glass-panel p-6 md:p-10 rounded-3xl relative overflow-hidden animate-[fadeIn_0.5s_ease-out]">
                                <div className="absolute top-0 right-0 p-6 opacity-10">
                                    <i className={`ph-fill ${activeReading.icon} text-9xl text-tarot-gold`}></i>
                                </div>
                                <div className="relative z-10">
                                    <h4 className="text-xs font-mono text-tarot-gold uppercase tracking-widest mb-2">{activeReading.position}</h4>
                                    <h3 className="font-serif text-3xl font-bold text-white mb-6 border-b border-tarot-gold/20 pb-4 inline-block pr-10">
                                        {activeReading.title}
                                    </h3>
                                    <p className="text-tarot-silver/90 text-base md:text-lg leading-relaxed font-light">
                                        {activeReading.meaning}
                                    </p>
                                </div>
                            </div>
                        )}

                        {allFlipped && (
                            <div className="mt-8 text-center animate-[fadeIn_1s_ease-out]">
                                <p className="italic text-tarot-gold/80 font-serif text-lg">
                                    "Las cartas han hablado. Eres una alquimista de la naturaleza, bendecida por la luna y guiada por el sol."
                                </p>
                            </div>
                        )}
                    </div>

                    {/* FOOTER */}
                    <footer className="mt-auto pt-12 text-center text-[10px] font-mono text-tarot-silver/30 uppercase tracking-widest">
                        Interpretación Cuántica por Infiniti IA & W Studio
                    </footer>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TarotApp />);
    </script>
</body>
</html>
